[package]
name = "k8s-operator"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
kube = { version = "0.93", features = ["derive", "client", "runtime"] }
k8s-openapi = { version = "0.22", features = ["v1_30"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
